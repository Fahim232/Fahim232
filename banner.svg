<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="55%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="nameFade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1000" height="200" fill="url(#bg)"/>

  <!-- fine vertical accent line (left) -->
  <rect x="56" y="46" width="3" height="108" rx="1.5" fill="url(#line)"/>

  <!-- name -->
  <text x="80" y="92" font-family="'Inter','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="42" font-weight="700" letter-spacing="-0.5" fill="url(#nameFade)">
    Fahim Montasir
  </text>

  <!-- role line -->
  <text x="80" y="128" font-family="'Inter','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="500" fill="#94A3B8">
    Computer Science Student
    <tspan dy="0" fill="#3B82F6">&#160;·&#160;</tspan><tspan dy="0">Software Quality &amp; Testing</tspan>
  </text>

  <!-- subtle tagline -->
  <text x="80" y="154" font-family="'Inter','Helvetica Neue',Arial,sans-serif" font-size="13" fill="#64748B">
    United International University · Building reliable, well-tested software
  </text>

  <!-- elegant thin rings (right) -->
  <g fill="none" stroke="#334155" stroke-width="1.2" opacity="0.9">
    <circle cx="918" cy="72" r="30" stroke-dasharray="3 5"/>
    <circle cx="918" cy="72" r="48" stroke="#1E293B"/>
    <circle cx="918" cy="72" r="16" fill="#3B82F6" fill-opacity="0.15" stroke="none"/>
  </g>
  <g fill="none" stroke="#334155" stroke-width="1" opacity="0.7">
    <circle cx="852" cy="132" r="22" stroke-dasharray="2 5"/>
  </g>

  <!-- footer hairline gradient -->
  <rect x="0" y="196" width="1000" height="4" fill="url(#line)" opacity="0.85"/>
</svg>